<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>YATA -- {{ repo_name }}</title>
<style>
  :root {
    --gold: #f0c246;
    --ink: #0d0a07;
    --parch: #e8dcc4;
    --panel: rgba(18, 12, 8, 0.88);
    --edge: #7a5a2a;
  }
  html, body { margin: 0; padding: 0; background: #0d0a07; color: var(--parch);
    font-family: "Courier New", monospace; overflow: hidden; }
  #game-root { position: fixed; inset: 0; }

  /* ---- HUD overlay. Pointer-events off except on real controls, so the
         Phaser world underneath stays pannable. ---- */
  #hud { position: fixed; inset: 0; pointer-events: none; z-index: 5; }
  .panel {
    background: var(--panel);
    border: 2px solid var(--edge);
    box-shadow: 0 0 0 1px #000, 0 4px 14px rgba(0,0,0,.6);
  }
  .panel-title {
    font-size: 11px; letter-spacing: 1.5px; color: var(--gold);
    padding: 6px 10px; border-bottom: 1px solid rgba(122,90,42,.5);
  }

  #guild-badge { position: absolute; top: 12px; left: 14px; width: 300px; pointer-events: auto; cursor: pointer; }
  #guild-badge .sub { font-size: 9px; color: #a08f6d; padding: 5px 10px; letter-spacing: .5px; }

  #threats { position: absolute; top: 78px; left: 14px; width: 300px; max-height: 44vh; overflow-y: auto; }
  #threat-list { padding: 4px 0 6px; }
  .threat { padding: 5px 10px 6px 12px; border-left: 3px solid #b23b3b; margin: 4px 8px; background: rgba(60,20,20,.35); }
  .threat.healed { border-left-color: #4f9e4f; background: rgba(20,50,20,.3); opacity: .72; }
  .threat .name { font-size: 12px; color: #ff8a7a; }
  .threat.healed .name { color: #90e08a; text-decoration: line-through; }
  .threat .meta { font-size: 9px; color: #a08f6d; margin-top: 2px; }
  .empty { font-size: 10px; color: #7d6f57; padding: 10px; text-align: center; }

  #xp-wrap { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); width: 340px; text-align: center; }
  #xp-label { font-size: 9px; color: var(--gold); letter-spacing: 1.5px; }
  #xp-bar { height: 14px; background: #2a1d10; border: 2px solid var(--edge); margin-top: 3px; position: relative; }
  #xp-fill { height: 100%; width: 0%; background: linear-gradient(90deg,#8a5a18,#f0c246); transition: width .5s ease; }
  #xp-text { position: absolute; inset: 0; font-size: 9px; line-height: 14px; color: #fff; text-shadow: 0 1px 2px #000; }

  #counters { position: absolute; top: 12px; right: 14px; display: flex; gap: 8px; align-items: flex-start; }
  .chip { display: flex; align-items: center; gap: 6px; padding: 6px 10px; font-size: 12px; color: var(--parch); }
  .chip img { width: 16px; height: 16px; image-rendering: pixelated; }
  #dossier { pointer-events: auto; cursor: pointer; color: var(--gold); font-size: 11px; padding: 7px 12px; letter-spacing: 1px; }

  #minimap-wrap { position: absolute; top: 76px; right: 14px; width: 190px; }
  #minimap { display: block; width: 186px; height: 104px; background: #05060c; }

  #log { position: absolute; bottom: 10px; right: 14px; width: 330px; max-height: 130px; overflow-y: auto;
    font-size: 10px; line-height: 1.45; padding: 6px 9px; }
  #log div { padding: 1px 0; color: #cbb98f; }
  #log div.hl { color: var(--gold); }

  #mode-badge { position: absolute; bottom: 10px; left: 14px; font-size: 10px; padding: 6px 10px; letter-spacing: 1px; }
  #mode-badge.owner { color: #a6e08a; border-color: #3f6f2f; }
  #mode-badge.readonly { color: #a08f6d; }

  #replay-bar { display: none; position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%);
    align-items: center; gap: 10px; padding: 6px 12px; font-size: 10px; letter-spacing: 1px; pointer-events: auto; }
  #replay-bar button { font-family: "Courier New", monospace; font-size: 10px; letter-spacing: 1px;
    padding: 4px 10px; background: #2a1d10; color: var(--gold); border: 1px solid var(--edge); cursor: pointer; }
  #replay-bar button:hover { background: #3d2b17; }
  #replay-mode { color: var(--gold); }
  #replay-status { color: #a08f6d; }

  /* ---- Parchment decision overlay ----
     A scrim dims the world behind it so the decision reads clearly on
     camera, and the parchment scales in so the cut is obvious in a recording. */
  #scrim {
    display: none; position: fixed; inset: 0; background: rgba(5, 3, 2, 0.62);
    z-index: 15; pointer-events: none;
  }
  #scrim.on { display: block; }
  /* The dcss parchment icons are only 32x32 and turn to mush when stretched
     to dialog size, so the panel uses Kenney's 9-slice frames instead --
     they scale crisply to any size. */
  #parchment-overlay {
    display: none; position: fixed; top: 50%; left: 50%;
    width: min(640px, 88vw); min-height: 250px;
    color: #3b2a14; flex-direction: column; align-items: center; justify-content: center;
    padding: 40px 46px; box-sizing: border-box; text-align: center; z-index: 20; pointer-events: auto;
    background-color: #f2e4c2;
    border-style: solid;
    border-width: 26px;
    border-image-source: url("/assets/ui/scroll/scroll_bg.png");
    border-image-slice: 40 fill;
    border-image-width: 26px;
    border-image-repeat: stretch;
    image-rendering: pixelated;
    filter: drop-shadow(0 12px 30px rgba(0,0,0,.75));
    transform: translate(-50%, -50%) scale(0.86);
    animation: parchment-in 260ms ease-out forwards;
  }
  /* Exception branch: same scroll, scorched. */
  #parchment-overlay.exception {
    background-color: #e8cdaa;
    filter: drop-shadow(0 12px 30px rgba(0,0,0,.75)) sepia(0.5) saturate(1.5) hue-rotate(-18deg);
  }
  #parchment-overlay.exception #parchment-message { color: #6d1b12; }
  @keyframes parchment-in {
    from { transform: translate(-50%, -50%) scale(0.86); opacity: 0; }
    to   { transform: translate(-50%, -50%) scale(1);    opacity: 1; }
  }
  #parchment-message { font-size: 18px; font-weight: bold; line-height: 1.5; margin-bottom: 22px; }
  #parchment-choices { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  #parchment-choices button {
    font-family: "Courier New", monospace; font-size: 14px; font-weight: bold; padding: 11px 20px;
    border-radius: 3px; border: 2px solid #6b4a24; background: #d9c79b; color: #2b1d0e; cursor: pointer;
    box-shadow: 0 2px 0 #6b4a24;
  }
  #parchment-choices button:hover { background: #efe0b6; }
</style>
</head>
<body>
<div id="game-root"></div>

<div id="hud">
  <div id="guild-badge" class="panel">
    <div class="panel-title">&#9670; GUILD HALL &nbsp;(<span id="guild-level">LV.1</span>)</div>
    <div class="sub">{{ repo_name }} &mdash; CLICK TO INSPECT VULNERABILITIES</div>
  </div>

  <div id="threats" class="panel">
    <div class="panel-title">GUILD THREAT RAIDS</div>
    <div id="threat-list"><div class="empty">No threats confirmed yet.</div></div>
  </div>

  <div id="xp-wrap">
    <div id="xp-label">LEVEL <span id="xp-level">1</span> GUILD</div>
    <div id="xp-bar"><div id="xp-fill"></div><div id="xp-text">0 / 0 XP</div></div>
  </div>

  <div id="counters">
    <div class="chip panel"><img id="icon-xp" alt=""><span id="stat-xp">0</span></div>
    <div class="chip panel"><img id="icon-heal" alt=""><span id="stat-healed">0/0</span></div>
    <div class="chip panel"><img id="icon-shield" alt=""><span id="stat-score">--</span></div>
    <div id="dossier" class="panel">DOSSIER</div>
  </div>

  <div id="minimap-wrap" class="panel">
    <div class="panel-title">MAP</div>
    <canvas id="minimap" width="186" height="104"></canvas>
  </div>

  <div id="log" class="panel"></div>
  <div id="mode-badge" class="panel {{ 'owner' if owner else 'readonly' }}">{{ 'GAMER MODE -- THIS VIEW DECIDES' if owner else 'DEVELOPER MODE -- READ-ONLY MIRROR' }}</div>

  <div id="replay-bar" class="panel">
    <span id="replay-mode">LIVE</span>
    <button id="replay-pause">PAUSE</button>
    <button id="replay-restart">RESTART</button>
    <span id="replay-status">0/0</span>
  </div>
</div>

<div id="scrim"></div>
<div id="parchment-overlay">
  <div id="parchment-message"></div>
  <div id="parchment-choices"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/phaser@3.70.0/dist/phaser.min.js"></script>
<script>
  window.YATA_OWNER = {{ 'true' if owner else 'false' }};
  window.YATA_REPO = {{ repo_name|tojson }};
</script>
<script src="{{ url_for('static', filename='game.js') }}"></script>
</body>
</html>
